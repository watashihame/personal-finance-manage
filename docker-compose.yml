services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portfolio}
      SECRET_KEY: ${SECRET_KEY}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      PRICE_PROXY: ${PRICE_PROXY:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/static
      - ./app.py:/app/app.py:ro
      - ./models.py:/app/models.py:ro
      - ./price_fetcher.py:/app/price_fetcher.py:ro
      - ./price_providers.py:/app/price_providers.py:ro
      - ./static/ui:/app/static/ui:ro
    networks:
      default:
      edge_net:
        aliases:
          - personal-finance-web

  mcp:
    build: .
    restart: unless-stopped
    command: python mcp_server.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-portfolio}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      PRICE_PROXY: ${PRICE_PROXY:-}
      TRANSPORT: streamable-http
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: "8000"
      MCP_TOKEN: ${MCP_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./mcp_server.py:/app/mcp_server.py:ro
      - ./models.py:/app/models.py:ro
      - ./price_fetcher.py:/app/price_fetcher.py:ro
      - ./price_providers.py:/app/price_providers.py:ro
    networks:
      default:
      edge_net:
        aliases:
          - personal-finance-mcp

volumes:
  postgres_data:
  static_files:

networks:
  edge_net:
    external: true
